<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" aria-labelledby="hero-title hero-desc" role="img" viewBox="0 0 1280 560"><title id="hero-title">by-human：自分のコンピューターで動く、自分専用のAIエージェント</title><desc id="hero-desc">オレンジ色の by-human のアプリアイコンと、127.0.0.1:4310 を開いたブラウザの窓。窓の中はチャット画面で、サイドバーに日付ごとの会話一覧、本文には「応答中」の表示とともに表とチェックリストの返信が届いている途中で、停止ボタンがある。右の iPhone では、同じチャットが時計ツールで確認した現在時刻を答えている。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FFF9F3"/><stop offset="1" stop-color="#FDE6D3"/></linearGradient><linearGradient id="icon" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF8A2E"/><stop offset="1" stop-color="#F06306"/></linearGradient><filter id="lift" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="18" flood-color="#7A3B10" flood-opacity=".16" stdDeviation="20"/></filter><filter id="lift-small" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="10" flood-color="#2A1608" flood-opacity=".22" stdDeviation="12"/></filter><clipPath id="window"><rect width="636" height="432" x="470" y="64" rx="20"/></clipPath><clipPath id="screen"><rect width="150" height="340" x="1090" y="182" rx="25"/></clipPath></defs><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Hiragino Sans&quot;,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,Meiryo,Helvetica,Arial,sans-serif;fill:#1f2328}.muted{fill:#5f646c}.faint{fill:#6c7179}.accent{fill:#c2410c}.bold{font-weight:700}.semi{font-weight:600}.line{fill:none;stroke:#e6e3dd}</style><rect width="1280" height="560" fill="url(#bg)" rx="32"/><circle cx="1220" cy="36" r="190" fill="#F76707" opacity=".07"/><circle cx="40" cy="566" r="220" fill="#F76707" opacity=".06"/><g transform="translate(84 92)"><rect width="208" height="208" fill="url(#icon)" filter="url(#lift)" rx="48"/><g fill="none" stroke="#FFFAF5" stroke-linecap="round" stroke-width="58" transform="scale(0.4