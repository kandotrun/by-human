[project]
name = "core"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "nnmykn", email = "ninomiya@kan.run" }
]
dependencies = [
    "opencv-python",
    "numpy",
    "torch",
    "ultralytics",
    "dolphin-mcp>=0.1.0",
    "langchain",
    "ollama",
    "langchain-community>=0.3.20",
    "langchain-ollama>=0.2.3",
    "rich>=13.9.4",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "black>=23.1.0"
]

[tool.rye.scripts]
main = { cmd = "python -m core.main" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'
