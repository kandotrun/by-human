name: Rust server

on:
  pull_request:
    paths:
      - 'server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'web-tests/**'
      - '.github/workflows/rust.yml'
  push:
    branches: [main, 'feat/**']
    paths:
      - 'server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'web-tests/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Rust and PostgreSQL contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: byhuman
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: byhuman
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U byhuman -d byhuman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://byhuman:local-test-only@127.0.0.1:5432/byhuman
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - run: npm ci
        working-directory: web-tests
      - run: npx playwright install --with-deps chromium
        working-directory: web-tests
      - name: Install Japanese fonts
        run: sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - run: npm test
        working-directory: web-tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web-tests/test-results/
          retention-days: 7
