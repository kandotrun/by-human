# by-human on an always-on Linux host: PostgreSQL, the server and a
# Cloudflare Tunnel connector. Secrets stay in BY_HUMAN_DEPLOY_DIR on the host;
# see docs/deploy.md.
name: by-human

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${BY_HUMAN_DEPLOY_DIR:?set BY_HUMAN_DEPLOY_DIR}/postgres.env
    environment:
      POSTGRES_USER: byhuman
      POSTGRES_DB: byhuman
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byhuman -d byhuman"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: by-human-server:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${BY_HUMAN_DEPLOY_DIR:?set BY_HUMAN_DEPLOY_DIR}/server.env
    environment:
      # Loopback inside this container. Only the tunnel, which shares this
      # network namespace, reaches the server; browser sessions rely on it.
      BY_HUMAN_LISTEN: 127.0.0.1:4310
    volumes:
      - auth:/home/by-human/.config/by-human
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4310/health"]
      interval: 10s
      timeout: 3s
      retries: 30

  tunnel:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    network_mode: service:server
    depends_on:
      server:
        condition: service_healthy
    # The token file is readable only by the host user that owns the deploy
    # directory, so the connector runs as that user.
    user: ${BY_HUMAN_DEPLOY_UID:?set BY_HUMAN_DEPLOY_UID}
    command: ["tunnel", "run", "--token-file", "/etc/cloudflared/tunnel.token"]
    volumes:
      - ${BY_HUMAN_DEPLOY_DIR:?set BY_HUMAN_DEPLOY_DIR}/tunnel.token:/etc/cloudflared/tunnel.token:ro

volumes:
  postgres:
  auth:
